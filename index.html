<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>غرفة الهروب القرائية | نورة المبرد</title><style>:root{font-family:Tahoma,Arial,sans-serif;color:#402450}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 10% 10%,#ffe2ef,transparent 35%),radial-gradient(circle at 90% 80%,#d9f8e6,transparent 35%),#f5edff;display:grid;place-items:center;padding:18px}.app{width:min(100%,660px);background:#ffffffed;border:3px solid #dec1f7;border-radius:30px;box-shadow:0 18px 55px #774d9d38;overflow:hidden}.top{background:linear-gradient(120deg,#9e70cc,#db9ac7);color:white;padding:25px;text-align:center}.top h1{margin:4px 0;font-size:clamp(24px,5vw,36px)}.top p{margin:8px 0}.content{padding:26px}.intro{text-align:center;line-height:2}.intro .door{font-size:78px}.progress{display:flex;gap:8px;margin:15px 0 23px}.progress span{height:12px;flex:1;background:#e8dff0;border-radius:20px}.progress span.done{background:#57bf90}.progress span.now{background:#a777db}.label{color:#8459ae;font-weight:bold}.story{background:#f5efff;border:1px solid #e0c9f5;border-radius:18px;padding:20px;line-height:2;font-size:18px}.question{font-weight:bold;font-size:21px;margin:22px 0 12px}.option{display:block;width:100%;border:2px solid #e6d6f1;background:#fff;border-radius:14px;padding:15px;text-align:right;font-size:17px;color:#402450;cursor:pointer;margin:10px 0}.option:hover{background:#faf3ff}.option.selected{border-color:#8654bd;background:#f3e7ff}.option.correct{border-color:#31a66c;background:#e7f9ef}.option.wrong{border-color:#d85b77;background:#fff0f2}.feedback{padding:14px;border-radius:12px;margin:14px 0;line-height:1.8}.success{background:#e7f8ec;color:#176a3c}.error{background:#fff0f2;color:#a72e4c}button.action{border:0;border-radius:15px;background:linear-gradient(110deg,#8552bb,#b36cc2);color:white;padding:16px 25px;font-size:19px;font-weight:bold;cursor:pointer;width:100%;margin-top:12px}button.action:disabled{opacity:.45;cursor:not-allowed}.finish{text-align:center;line-height:2}.finish .trophy{font-size:80px}.foot{text-align:center;font-size:14px;color:#805c93;padding:16px;border-top:1px solid #f0e5f8}@media(max-width:420px){.content{padding:17px}.story{font-size:16px}.option{font-size:16px}} .field{display:block;width:100%;padding:14px;border:2px solid #dfc8ed;border-radius:12px;font:inherit;margin:9px 0 16px}.certificate{border:6px double #a67bd1;background:linear-gradient(145deg,#fff,#f9f0ff);border-radius:18px;padding:25px;text-align:center;line-height:2}.certificate h2{color:#7746a3}.certificate .student{font-size:26px;font-weight:bold;color:#64318d}.hint{font-size:13px;color:#6e547d}@media print{body{background:white;padding:0}.top,.foot,.action,.hint{display:none!important}.app{border:0;box-shadow:none;width:100%}.content{padding:0}.certificate{min-height:75vh;display:flex;flex-direction:column;justify-content:center} } </style></head><body><main class="app"><header class="top"><div>📚 ✨ 🔐</div><h1>غرفة الهروب القرائية</h1><p>أسرار المكتبة المغلقة</p></header><section class="content" id="view"></section><footer class="foot">إعداد الطالبة / نورة المبرد 🌷 معلمتي / الجوهرة المقبل</footer></main><script>
const puzzles=[{title:'مفتاح الفكرة الرئيسة',story:'دخلت نورة مكتبة المدرسة، فوجدت كتبًا متنوعة. اختارت قصة مفيدة وقرأت أحداثها، ثم شاركت زميلاتها ما تعلمته.',question:'ما الفكرة الرئيسة للنص؟',options:['أهمية القراءة والاستفادة من الكتب','تنظيم الفسحة المدرسية','الاهتمام بالرياضة'],correct:0,explain:'النص يركز على قراءة الكتب والاستفادة منها.'},{title:'مفتاح الاستنتاج',story:'كانت سارة تعيد الكتب إلى أماكنها بعد قراءتها، وتحرص على ألا تطوي صفحاتها.',question:'ما الصفة التي نستنتجها من تصرف سارة؟',options:['الإهمال','المحافظة على الممتلكات','التسرع'],correct:1,explain:'سارة تحافظ على الكتب وتعيدها إلى أماكنها.'},{title:'مفتاح المفردات',story:'ثابرت نورة على القراءة كل يوم حتى أصبحت أكثر طلاقة في قراءة النصوص.',question:'ما معنى كلمة «ثابرت»؟',options:['توقفت','ترددت','واصلت واجتهدت'],correct:2,explain:'المثابرة تعني الاستمرار والاجتهاد.'},{title:'مفتاح السبب والنتيجة',story:'خصصت المعلمة عشر دقائق للقراءة اليومية، فازدادت حصيلة الطالبات اللغوية وتحسن فهمهن للنصوص.',question:'ما سبب تحسن الفهم القرائي؟',options:['تخصيص وقت يومي للقراءة','تقليل قراءة الكتب','إلغاء الأنشطة'],correct:0,explain:'القراءة المنتظمة ساعدت على تنمية الفهم.'},{title:'مفتاح التفكير الناقد',story:'اقترحت نورة إنشاء ركن للقراءة في الفصل، وتبادل القصص بين الطالبات، ومناقشة الأفكار بعد الانتهاء من القراءة.',question:'أي إجراء يساعد على معرفة أثر المبادرة؟',options:['الاكتفاء بتزيين الركن','مقارنة مستوى الفهم قبل المبادرة وبعدها','إغلاق الركن بعد أسبوع'],correct:1,explain:'المقارنة قبل المبادرة وبعدها تساعد على قياس التحسن.'}];
let stage=-1,choice=-1,student='',studentClass='',completedAt='';const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const view=document.getElementById('view');function render(){if(stage===-1){view.innerHTML='<div class="intro"><div class="door">🚪🔐</div><h2>مرحبًا بكِ في مغامرة القراءة!</h2><p>اكتبي اسمكِ وفصلكِ أولًا. بعد حل الألغاز الخمسة ستحصلين على شاهد إتمام باسمكِ.</p><label for="student">اسم الطالبة</label><input class="field" id="student" maxlength="90" placeholder="الاسم الثلاثي" required><label for="studentClass">الفصل</label><input class="field" id="studentClass" maxlength="30" placeholder="مثال: السادس / ١"><button class="action" id="start">ابدئي المغامرة ✨</button></div>';document.getElementById('start').onclick=()=>{const n=document.getElementById('student').value.trim(),c=document.getElementById('studentClass').value.trim();if(!n||!c){alert('يرجى كتابة اسم الطالبة والفصل');return}student=n;studentClass=c;stage=0;choice=-1;render()};return}if(stage===5){if(!completedAt)completedAt=new Date().toLocaleString('ar-SA',{dateStyle:'medium',timeStyle:'short'});view.innerHTML=`<div class="certificate"><div style="font-size:45px">🏆📚🔑</div><h2>شهادة إتمام غرفة الهروب القرائية</h2><p>🎉 الطالبة التي نجحت في حل جميع الألغاز:</p><div class="student">${esc(student)}</div><p>مبارك لكِ إتمام غرفة الهروب القرائية!</p><p>الفصل: ${esc(studentClass)}</p><p>أتمّت بنجاح <strong>٥ من ٥ ألغاز قرائية</strong> في نشاط «أسرار المكتبة المغلقة»، وأظهرت مهارات الفهم القرائي والتفكير الناقد.</p><p><strong>تاريخ ووقت الإتمام:</strong> ${esc(completedAt)}</p><p>إعداد / نورة المبرد<br>معلمتي / الجوهرة المقبل</p></div><p class="hint">📸 احفظي لقطة شاشة للشهادة أو استخدمي زر الطباعة وحفظ PDF، ثم أرسليها إلى المعلمة كشاهد على الإتمام. هذا الشاهد يصدر على جهاز الطالبة ولا يُرسل تلقائيًا للمعلمة.</p><button class="action" id="print">🖨️ حفظ الشهادة أو طباعتها</button><button class="action" id="again">البدء من جديد ↻</button>`;document.getElementById('print').onclick=()=>window.print();document.getElementById('again').onclick=()=>{stage=-1;choice=-1;completedAt='';render()};return}const p=puzzles[stage];const solved=choice===p.correct;view.innerHTML=`<div class="label">🔑 اللغز ${stage+1} من 5 | ${p.title}</div><div class="progress">${puzzles.map((_,i)=>`<span class="${i<stage?'done':i===stage?'now':''}"></span>`).join('')}</div><div class="label">📖 اقرئي النص جيدًا:</div><div class="story">${p.story}</div><div class="question">${p.question}</div>${p.options.map((o,i)=>`<button class="option ${choice===i?(solved?'correct':'wrong'):''}" data-choice="${i}" ${solved?'disabled':''}>${['أ','ب','ج'][i]}) ${o}</button>`).join('')}${choice===-1?'':`<div class="feedback ${solved?'success':'error'}">${solved?'🔓 إجابة صحيحة! '+p.explain:'🔒 لم يُفتح القفل بعد. فكري وحاولي مجددًا.'}</div>`}${solved?`<button class="action" id="next">${stage===4?'افتحي صندوق الكنز 🎁':'انتقلي إلى اللغز التالي ←'}</button>`:''}`;document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{choice=Number(b.dataset.choice);render()});if(solved)document.getElementById('next').onclick=()=>{stage++;choice=-1;render()}}render();
</script></body></html>
